<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lomnice nad Popelkou – kreslená mapa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/map.css">
</head>
<body>
<div id="map" tabindex="0" aria-label="Kreslená izometrická mapa Lomnice nad Popelkou. Táhněte pro posun, kolečkem nebo prsty přibližujte.">
  <canvas id="tiles"></canvas>
  <canvas id="labels"></canvas>
</div>
<div id="loading">Maluji mapu…</div>

<section id="title" class="sheet">
  <h1>Lomnice nad Popelkou</h1>
  <p>Kreslená mapa města podle OpenStreetMap</p>
  <div class="row" role="group" aria-label="Roční období">
    <button class="chip" data-season="spring" aria-pressed="true">Jaro</button>
    <button class="chip" data-season="summer" aria-pressed="false">Léto</button>
    <button class="chip" data-season="autumn" aria-pressed="false">Podzim</button>
    <button class="chip" data-season="winter" aria-pressed="false">Zima</button>
  </div>
  <div class="row" role="group" aria-label="Denní doba">
    <button class="chip" data-time="day" aria-pressed="true">Den</button>
    <button class="chip" data-time="night" aria-pressed="false">Noc</button>
  </div>
  <button id="fsBtn" aria-label="Celá obrazovka" title="Celá obrazovka">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <g class="fs-on"><path d="M4 9V4h5"/><path d="M20 9V4h-5"/><path d="M4 15v5h5"/><path d="M20 15v5h-5"/></g>
      <g class="fs-off" style="display:none"><path d="M9 4v5H4"/><path d="M15 4v5h5"/><path d="M9 20v-5H4"/><path d="M15 20v-5h5"/></g>
    </svg>
  </button>
</section>

<button id="placesBtn" class="sheet" aria-expanded="false" aria-controls="places">Zajímavá místa</button>
<nav id="places" class="sheet" aria-label="Zajímavá místa"></nav>

<div id="tools" class="sheet">
  <button class="btn" id="zin" aria-label="Přiblížit">+</button>
  <button class="btn" id="zout" aria-label="Oddálit">−</button>
  <button class="btn" id="home" aria-label="Zpět na Husovo náměstí" style="font-size:19px">⌂</button>
  <svg id="compass" viewBox="-20 -20 40 40" aria-label="Sever" role="img">
    <g transform="rotate(0)" stroke="currentColor" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 -15 L5 4 L0 1 L-5 4 Z" fill="currentColor" fill-opacity=".85"/>
      <path d="M0 1 L0 13"/>
    </g>
    <text x="7" y="-12" font-family="Caveat,cursive" font-size="12" font-weight="700" fill="currentColor">S</text>
  </svg>
</div>

<div id="info" class="sheet" role="dialog" aria-live="polite">
  <button class="btn x" aria-label="Zavřít">×</button>
  <h2></h2><p></p>
  <button id="infoImageBtn" class="info-image-btn" type="button" aria-label="Zobrazit fotografii budovy" title="Zobrazit fotografii" hidden>i</button>
</div>

<div id="photoModal" class="photo-modal" aria-hidden="true">
  <div class="photo-modal-card" role="dialog" aria-modal="true" aria-label="Fotografie budovy">
    <button id="photoClose" class="photo-close" type="button" aria-label="Zavřít fotografii">×</button>
    <div class="photo-navigation" role="group" aria-label="Navigace fotografií">
      <button id="photoBack" type="button" aria-label="Zpět o krok" title="Zpět o krok">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5 3 12l6 7M4 12h16"/></svg>
      </button>
      <button id="photoMap" type="button" aria-label="Zpět na mapu" title="Zpět na mapu">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6.5 8.5 4l7 2.5L21 4v13.5L15.5 20l-7-2.5L3 20zM8.5 4v13.5M15.5 6.5V20"/></svg>
      </button>
    </div>
    <div id="photoStage" class="photo-stage">
      <img id="buildingPhoto" alt="">
      <button id="doorRadnice" class="door-hotspot" type="button" aria-label="Vstoupit do radnice"><span>Vstoupit</span></button>
      <button id="doorKostel" class="door-hotspot" type="button" aria-label="Vstoupit do kostela"><span>Vstoupit</span></button>
      <button class="waypoint-hotspot waypoint-matrika" type="button" aria-label="Matrika">
        <svg viewBox="0 0 150 56" aria-hidden="true"><path class="sign-shadow" d="M4 5 H118 L146 28 L118 51 H4 Z"/><path class="sign-body" d="M4 5 H118 L146 28 L118 51 H4 Z"/><text x="62" y="35" text-anchor="middle">Matrika</text></svg>
      </button>
      <button class="waypoint-hotspot waypoint-podatelna" type="button" aria-label="Podatelna">
        <svg viewBox="0 0 160 56" aria-hidden="true"><path class="sign-shadow" d="M156 5 H33 L4 28 L33 51 H156 Z"/><path class="sign-body" d="M156 5 H33 L4 28 L33 51 H156 Z"/><text x="98" y="35" text-anchor="middle">Podatelna</text></svg>
      </button>
      <button class="waypoint-hotspot waypoint-obradni" type="button" aria-label="Obřadní síň">
        <svg viewBox="0 0 185 56" aria-hidden="true"><path class="sign-shadow" d="M4 5 H153 L181 28 L153 51 H4 Z"/><path class="sign-body" d="M4 5 H153 L181 28 L153 51 H4 Z"/><text x="78" y="35" text-anchor="middle">Obřadní síň</text></svg>
      </button>
      <button class="waypoint-hotspot waypoint-farni" type="button" aria-label="Farní úřad">
        <svg viewBox="0 0 155 56" aria-hidden="true"><path class="sign-shadow" d="M151 5 H33 L4 28 L33 51 H151 Z"/><path class="sign-body" d="M151 5 H33 L4 28 L33 51 H151 Z"/><text x="98" y="35" text-anchor="middle">Farní úřad</text></svg>
      </button>
      <button class="waypoint-hotspot waypoint-patro" type="button" aria-label="1. patro">
        <svg viewBox="0 0 170 170" aria-hidden="true"><path class="sign-shadow" d="M8 8 H58 V43 H91 L160 112 L126 160 L57 91 H8 Z"/><path class="sign-body" d="M8 8 H58 V43 H91 L160 112 L126 160 L57 91 H8 Z"/><text x="93" y="104" text-anchor="middle" transform="rotate(45 93 104)">1. patro</text></svg>
      </button>
      <div class="waypoint-hotspot waypoint-floor2" role="img" aria-label="2. patro">
        <svg viewBox="0 0 170 170" aria-hidden="true"><path class="sign-shadow" d="M8 162 H58 V127 H91 L160 58 L126 10 L57 79 H8 Z"/><path class="sign-body" d="M8 162 H58 V127 H91 L160 58 L126 10 L57 79 H8 Z"/><text x="93" y="104" text-anchor="middle" transform="rotate(-45 93 104)">2. patro</text></svg>
      </div>
      <button class="waypoint-hotspot waypoint-back-left" type="button" aria-label="Pokračovat do dalších kanceláří">
        <svg viewBox="0 0 185 44" preserveAspectRatio="none" aria-hidden="true"><path class="sign-shadow" d="M8 22 L40 2 L40 9 L174 9 L174 35 L40 35 L40 42 Z"/><path class="sign-body" d="M8 22 L40 2 L40 9 L174 9 L174 35 L40 35 L40 42 Z"/></svg>
      </button>
      <div class="waypoint-hotspot waypoint-back-right" role="img" aria-label="Směr vpravo">
        <svg viewBox="0 0 185 44" preserveAspectRatio="none" aria-hidden="true"><path class="sign-shadow" d="M177 22 L145 2 L145 9 L11 9 L11 35 L145 35 L145 42 Z"/><path class="sign-body" d="M177 22 L145 2 L145 9 L11 9 L11 35 L145 35 L145 42 Z"/></svg>
      </div>
      <div class="waypoint-hotspot waypoint-second-secretary" role="img" aria-label="Tajemník">
        <svg viewBox="0 0 185 56" aria-hidden="true"><path class="sign-shadow" d="M181 5 H32 L4 28 L32 51 H181 Z"/><path class="sign-body" d="M181 5 H32 L4 28 L32 51 H181 Z"/><text x="108" y="35" text-anchor="middle">Tajemník</text></svg>
      </div>
      <div class="waypoint-hotspot waypoint-second-secretariat" role="img" aria-label="Sekretariát">
        <svg viewBox="0 0 185 56" aria-hidden="true"><path class="sign-shadow" d="M4 5 H153 L181 28 L153 51 H4 Z"/><path class="sign-body" d="M4 5 H153 L181 28 L153 51 H4 Z"/><text x="78" y="35" text-anchor="middle">Sekretariát</text></svg>
      </div>
      <div class="waypoint-hotspot waypoint-second-deputy" role="img" aria-label="Místostarosta">
        <svg viewBox="0 0 185 56" aria-hidden="true"><path class="sign-shadow" d="M181 5 H32 L4 28 L32 51 H181 Z"/><path class="sign-body" d="M181 5 H32 L4 28 L32 51 H181 Z"/><text x="108" y="35" text-anchor="middle">Místostarosta</text></svg>
      </div>
      <div class="waypoint-hotspot waypoint-second-mayor" role="img" aria-label="Starosta">
        <svg viewBox="0 0 185 56" aria-hidden="true"><path class="sign-shadow" d="M4 5 H153 L181 28 L153 51 H4 Z"/><path class="sign-body" d="M4 5 H153 L181 28 L153 51 H4 Z"/><text x="78" y="35" text-anchor="middle">Starosta</text></svg>
      </div>
      <button class="waypoint-hotspot waypoint-tajemnik" type="button" aria-label="Tajemník">
        <svg viewBox="0 0 185 56" aria-hidden="true"><path class="sign-shadow" d="M4 5 H153 L181 28 L153 51 H4 Z"/><path class="sign-body" d="M4 5 H153 L181 28 L153 51 H4 Z"/><text x="78" y="35" text-anchor="middle">Tajemník</text></svg>
      </button>
      <button class="waypoint-hotspot waypoint-sekretariat" type="button" aria-label="Sekretariát">
        <svg viewBox="0 0 185 56" aria-hidden="true"><path class="sign-shadow" d="M181 5 H32 L4 28 L32 51 H181 Z"/><path class="sign-body" d="M181 5 H32 L4 28 L32 51 H181 Z"/><text x="108" y="35" text-anchor="middle">Sekretariát</text></svg>
      </button>
      <button class="waypoint-hotspot waypoint-mistostarosta" type="button" aria-label="Místostarosta">
        <svg viewBox="0 0 185 56" aria-hidden="true"><path class="sign-shadow" d="M4 5 H153 L181 28 L153 51 H4 Z"/><path class="sign-body" d="M4 5 H153 L181 28 L153 51 H4 Z"/><text x="78" y="35" text-anchor="middle">Místostarosta</text></svg>
      </button>
      <button class="waypoint-hotspot waypoint-starosta" type="button" aria-label="Starosta">
        <svg viewBox="0 0 185 56" aria-hidden="true"><path class="sign-shadow" d="M181 5 H32 L4 28 L32 51 H181 Z"/><path class="sign-body" d="M181 5 H32 L4 28 L32 51 H181 Z"/><text x="108" y="35" text-anchor="middle">Starosta</text></svg>
      </button>
    </div>
    <div id="photoCaption" class="photo-caption"></div>
  </div>
</div>

<div id="attr">Data © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">přispěvatelé OpenStreetMap</a></div>

<script src="js/map.js" defer></script>
</body>
</html>
